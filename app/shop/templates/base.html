<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Desk Shop{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('shop.index') }}">Desk Shop</a>
  {% if g.user %}
  <form class="search" action="{{ url_for('shop.search') }}" method="get">
    <input name="q" placeholder="Search products" aria-label="Search products">
  </form>
  <nav>
    {% if g.user.role == 'admin' %}
    <a href="{{ url_for('admin.console') }}">Flags</a>
    <a href="{{ url_for('admin.metrics') }}">Metrics</a>
    {% endif %}
    <span class="who">{% if g.user.avatar %}<img src="{{ g.user.avatar }}" alt="">{% endif %}{{ g.user.login }}</span>
    <form action="{{ url_for('auth.logout') }}" method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="link">Sign out</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% for msg in get_flashed_messages() %}<p class="flash">{{ msg }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
