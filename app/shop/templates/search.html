{% extends "base.html" %}
{% block title %}Search: {{ q }} · Desk Shop{% endblock %}
{% block content %}
<h1>Results for "{{ q }}"</h1>
<ul class="plain">
  {% for p in products %}
  <li><a href="{{ url_for('shop.product', sku=p.sku) }}">{{ p.name }}</a> - ${{ p.price }}</li>
  {% else %}
  <li>No products found.</li>
  {% endfor %}
</ul>
{% endblock %}
