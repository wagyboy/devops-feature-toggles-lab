# DevSecOps pipeline for the feature-toggle shop.
# Every push and pull request runs the gates below. Render deploys a commit on main only when
# all of these checks pass (render.yaml: autoDeployTrigger: checksPass), so a red run never ships.
name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Flake8 + bandit + bugbear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install flake8==7.4.1 flake8-bandit==4.1.1 flake8-bugbear==26.10.27
      - run: flake8 app scripts

  test:
    name: Tests (both states of every toggle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r app/requirements-dev.txt
      - run: python -m pytest -v
        working-directory: app

  secrets:
    name: Secret scan (Gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # scan every commit, not only the last one
      - name: Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload findings to the Security > Code scanning tab
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        run: semgrep scan --config p/python --config p/flask --config p/secrets --sarif --output semgrep.sarif --error --metrics off app scripts
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dockerfile:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < app/Dockerfile

  image-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t desk-shop:${{ github.sha }} app
      # Pinned to a commit SHA, not a tag: in March 2026 an attacker force-pushed 76 of the
      # 77 trivy-action tags (CVE-2026-33634).
      - name: Trivy (report to Code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: desk-shop:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          version: v0.69.3
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: desk-shop:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.69.3
          skip-setup-trivy: true

  dast:
    name: DAST (OWASP ZAP baseline, report only)
    runs-on: ubuntu-latest
    needs: [image-scan]
    steps:
      - uses: actions/checkout@v7
      - name: Start the shop
        run: |
          docker build -t desk-shop:ci app
          docker network create zapnet
          docker run -d --name shop --network zapnet -e SECRET_KEY="$(openssl rand -hex 32)" desk-shop:ci
          for i in $(seq 1 30); do docker exec shop python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" && break; sleep 1; done
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network zapnet -v "$PWD/zap:/zap/wrk" zaproxy/zap-stable:2.17.0 \
            zap-baseline.py -t http://shop:8000 -r zap-baseline.html -J zap-baseline.json -I
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-report
          path: zap/
