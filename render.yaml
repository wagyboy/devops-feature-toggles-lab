# Render Blueprint: one Docker web service and one PostgreSQL database, both on the free plan.
# Secrets are never in this file: SECRET_KEY is generated by Render, the GitHub OAuth values are
# entered once in the Render dashboard (sync: false), DATABASE_URL is wired from the database.
services:
  - type: web
    name: desk-shop
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # deploy main only after every GitHub Actions check is green
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ADMIN_GITHUB_LOGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: desk-shop-db
          property: connectionString
databases:
  - name: desk-shop-db
    plan: free
    region: singapore
